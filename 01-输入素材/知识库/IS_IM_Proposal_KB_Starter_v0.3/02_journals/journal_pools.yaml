version: 0.1.0
policy:
  main_result_eligibility: 论文仅在期刊等级通过UTD24或FMS 2025硬白名单验证后，才计入用户要求数量。
  supplementary_pool: AIS Premier/SIG、会议与跨学科期刊可用于发现、理论和方法补充；除非同时通过硬白名单验证，否则不得计入主数量。
  runtime_join: 期刊池只负责主题路由；等级必须与JournalRecord精确连接，不得从池名推断。
