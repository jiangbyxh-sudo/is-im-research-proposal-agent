  - 适用研究
  - 适用主题
  - 研究模块
  group_by_source_section: true
  merge_aliases: true
  preserve_all_source_groups: true
  quick_topic_mapping_role: routing_shortcuts_only
  quick_topic_mapping_is_complete_catalog: false
