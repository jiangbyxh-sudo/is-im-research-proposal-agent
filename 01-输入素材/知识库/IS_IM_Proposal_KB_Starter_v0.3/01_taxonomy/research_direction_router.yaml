output_labels:
- IS
- IM
- IS_IM
- OUT_OF_SCOPE
- UNCERTAIN
decision_rule:
  IS: 核心贡献解释或设计数字技术/信息系统及其对个体、组织、市场或社会的影响。
  IM: 核心贡献解释信息、数据、知识的生产、组织、检索、治理、传播与使用。
  IS_IM: 技术/系统与信息/知识过程均为核心贡献对象。
  OUT_OF_SCOPE: 不存在可实质化的技术、系统、信息、数据或知识贡献。
  UNCERTAIN: 只有行业/现象名，无法识别核心对象、关系或贡献。
