version: 1.1.6-p1-retrieval
defaults:
  boundary_policy:
    require_core_phenomenon: true
    require_context_any: true
    excluded_only_action: reject
    insufficient_metadata_action: manual_review
  document_types: [journal-article]
  coverage_targets:
    raw_min: 20
    post_boundary_min: 10
    precision_at_10_min: 0.80
  generic_negative_contexts:
    - clinical diagnosis only
    - medical imaging only
    - pure algorithm benchmark
    - pure hardware engineering
    - chemistry or materials experiment only

