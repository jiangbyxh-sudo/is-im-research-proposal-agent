version: 0.4.0
policy:
  do_not_merge_rankings: CAS/CSSCI/PKU/FMS/UTD均保留独立字段；不得将“同时入选”自动折算为自定义A/B等级。
  default_chinese_profile: EXPANDED_CN_CORE
  default_english_profile: ORIGINAL_UTD_FMS
  cas_note: CAS 2025只作为国际英文扩展资格；2026起已停更。
  verification_gate: 若某论文是否满足用户指定评级无法从本地版本化名单确认，则触发JOURNAL_RANK_UNVERIFIED，而不是猜测。
